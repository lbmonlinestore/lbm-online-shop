<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Choose a New Password | LBM Lay-Bay</title>
  <link rel="stylesheet" href="lay-bay.css">
  <style>
    *{box-sizing:border-box}
    body{background:#080808;color:#eee}
    .topbar{background:#080808;border-bottom:1px solid #D4AF37}
    .brand span,.back-link,a{color:#D4AF37}
    main{max-width:480px;margin:55px auto;padding:20px}
    .hero-card{background:#151515;color:#eee;border:1px solid #D4AF37;border-radius:12px;padding:22px}
    h2{color:#D4AF37}
    label{display:block;margin-top:17px}
    .field{position:relative;margin-top:7px}
    .field input{display:block;width:100%;padding:13px 65px 13px 13px;border:1px solid #777;border-radius:8px;background:#080808;color:#fff;font-size:15px}
    .field input:focus{outline:1px solid #D4AF37;border-color:#D4AF37}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:7px;border:0;background:transparent;color:#D4AF37;font-weight:bold;cursor:pointer}
    .btn{width:100%;padding:14px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:18px;background:#D4AF37;color:#080808;border:0}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    #pageMessage{line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
    #resetForm[hidden]{display:none}
  </style>
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="brand">LBM <span>LAY-BAY</span></a>
  <a href="login.html" class="back-link">Login</a>
</header>
<main>
  <section class="hero-card">
    <h2>Choose a new password</h2>
    <p>Use at least 8 characters. Choose a password you have not used elsewhere.</p>
    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <div class="field">
        <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button class="toggle" type="button" data-toggle="newPassword">Show</button>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="field">
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button class="toggle" type="button" data-toggle="confirmPassword">Show</button>
      </div>
      <button id="saveButton" class="btn" type="submit">Save New Password</button>
    </form>
    <p id="pageMessage" role="status" aria-live="polite">Verifying your secure reset link...</p>
    <p style="margin-top:20px;text-align:center"><a href="login.html">Return to Login</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://toovotqrcsulhgdrcsmn.supabase.co";
  const SUPABASE_KEY="sb_publishable_aNXeSFItUW9hhq2iJ19tug_fvrvoXbg";
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const form=document.getElementById("resetForm");
  const password=document.getElementById("newPassword");
  const confirm=document.getElementById("confirmPassword");
  const button=document.getElementById("saveButton");
  const message=document.getElementById("pageMessage");
  let recoverySessionReady=false;
  let recoveryError=null;
  let submitted=false;
  function show(text,ok){message.textContent=text;message.style.color=ok?"#D4AF37":"#ff7777";}
  document.querySelectorAll("[data-toggle]").forEach(function(toggle){
    toggle.addEventListener("click",function(){
      const input=document.getElementById(toggle.dataset.toggle);
      const visible=input.type==="password";
      input.type=visible?"text":"password";
      toggle.textContent=visible?"Hide":"Show";
      toggle.setAttribute("aria-label",visible?"Hide password":"Show password");
    });
  });
  function ready(){
    if(recoveryError){show(recoveryError,false);return;}
    if(recoverySessionReady){form.hidden=false;show("Your reset link is verified. Enter your new password below.",true);}
  }
  db.auth.onAuthStateChange(function(event,session){
    if(event==="PASSWORD_RECOVERY"&&session){
      recoverySessionReady=true;
      ready();
    }else if(event==="SIGNED_OUT"&&!submitted&&!recoverySessionReady){
      recoveryError="This reset link is invalid or has expired. Please request a new password-reset link.";
      ready();
    }
  });
  db.auth.getSession().then(function(result){
    if(result.error){recoveryError="We could not verify this reset link. Please request a new one.";ready();return;}
    if(result.data.session){
      recoverySessionReady=true;
      ready();
    }else if(!recoverySessionReady){
      recoveryError="This reset link is invalid or has expired. Please request a new password-reset link.";
      ready();
    }
  });
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    if(!recoverySessionReady){show("Please open the password-reset link from your email again.",false);return;}
    if(password.value.length<8){show("Your new password must contain at least 8 characters.",false);return;}
    if(password.value!==confirm.value){show("The two passwords do not match.",false);return;}
    button.disabled=true;
    button.textContent="Saving...";
    show("Updating your password securely...",true);
    try{
      const {error}=await db.auth.updateUser({password:password.value});
      if(error)throw error;
      submitted=true;
      form.hidden=true;
      show("Your password has been changed successfully. You can now log in using your new password.",true);
      await db.auth.signOut();
    }catch(error){
      show(error.message||"We could not update your password. Please try again.",false);
      button.disabled=false;
      button.textContent="Save New Password";
    }
  });
})();
</script>
</body>
</html>
