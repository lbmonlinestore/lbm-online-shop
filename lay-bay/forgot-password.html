<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Forgot Password | LBM Lay-Bay</title>
  <link rel="stylesheet" href="lay-bay.css">
  <style>
    *{box-sizing:border-box}
    body{background:#080808;color:#eee}
    .topbar{background:#080808;border-bottom:1px solid #D4AF37}
    .brand span,.back-link,a{color:#D4AF37}
    main{max-width:480px;margin:55px auto;padding:20px}
    .hero-card{background:#151515;color:#eee;border:1px solid #D4AF37;border-radius:12px;padding:22px}
    h2{color:#D4AF37}
    label{display:block;margin-top:17px}
    .login-input{display:block;width:100%;padding:13px;border:1px solid #777;border-radius:8px;margin-top:7px;background:#080808;color:#fff;font-size:15px}
    .login-input:focus{outline:1px solid #D4AF37;border-color:#D4AF37}
    .btn{width:100%;padding:14px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:18px;background:#D4AF37;color:#080808;border:0}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    #resetMessage{line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
    #resetMessage.rate-limit{padding:12px;border:1px solid #D4AF37;border-radius:8px;background:#211d10;color:#f5df9a!important}
  </style>
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="brand">LBM <span>LAY-BAY</span></a>
  <a href="login.html" class="back-link">Back to Login</a>
</header>
<main>
  <section class="hero-card">
    <h2>Forgot your password?</h2>
    <p>Enter the email address registered to your LBM Lay-Bay account. We will send you a secure password-reset link.</p>
    <form id="forgotForm">
      <label for="email">Email address</label>
      <input id="email" class="login-input" type="email" autocomplete="email" placeholder="example@email.com" required>
      <button id="sendButton" class="btn" type="submit">Send Reset Link</button>
      <p id="resetMessage" role="status" aria-live="polite"></p>
    </form>
    <p style="margin-top:20px;text-align:center"><a href="login.html">Return to Login</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://toovotqrcsulhgdrcsmn.supabase.co";
  const SUPABASE_KEY="sb_publishable_aNXeSFItUW9hhq2iJ19tug_fvrvoXbg";
  const form=document.getElementById("forgotForm");
  const emailInput=document.getElementById("email");
  const button=document.getElementById("sendButton");
  const message=document.getElementById("resetMessage");
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  function show(text,ok,isRateLimit){
    message.textContent=text;
    message.style.color=ok?"#D4AF37":"#ff7777";
    message.classList.toggle("rate-limit",!!isRateLimit);
  }

  function isEmailRateLimit(error){
    const details=[error&&error.message,error&&error.code,error&&error.status]
      .filter(Boolean).join(" ").toLowerCase();
    return details.includes("rate limit") ||
      details.includes("too many requests") ||
      details.includes("429");
  }

  form.addEventListener("submit",async function(event){
    event.preventDefault();
    const email=emailInput.value.trim().toLowerCase();
    if(!email){show("Please enter your account email address.",false,false);return;}

    button.disabled=true;
    button.textContent="Sending...";
    show("Requesting a secure reset link...",true,false);

    try{
      const redirectTo=new URL("reset-password.html",window.location.href).href;
      const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});
      if(error)throw error;

      show("If an account exists for that email address, a password-reset link has been sent. Please check your inbox and spam folder. The link can only be used once and may expire.",true,false);
      button.textContent="Reset Link Requested";
    }catch(error){
      if(isEmailRateLimit(error)){
        show("Our email service has temporarily reached its sending limit. This limit is shared across LBM Lay-Bay authentication emails, including signup confirmations and password-reset emails. It does not necessarily mean you personally requested too many reset links. Please wait for the hourly limit to reset before trying again. Your password has not been changed.",false,true);
        button.textContent="Please Wait Before Retrying";
      }else{
        show(error.message||"We could not send the reset email. Please try again.",false,false);
        button.textContent="Send Reset Link";
      }
    }finally{
      button.disabled=false;
    }
  });
})();
</script>
</body>
</html>
